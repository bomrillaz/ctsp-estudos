name: Push diário CTSP

# Fase 4c. Disparo MANUAL (workflow_dispatch) = teste/aviso, força envio a todos.
# Disparo AGENDADO (schedule) = condicional: só quem tem revisão vencida.
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: 'Título da notificação (opcional)'
        required: false
        default: ''
      corpo:
        description: 'Texto da notificação (opcional)'
        required: false
        default: ''
  schedule:
    - cron: '0 11 * * *'    # 08:00 (horário de Brasília, UTC-3) — manhã
    - cron: '0 22 * * *'    # 19:00 (horário de Brasília) — início da noite

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: Enviar push
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_TITULO: ${{ github.event.inputs.titulo }}
          PUSH_CORPO: ${{ github.event.inputs.corpo }}
        run: node enviar-push.js
