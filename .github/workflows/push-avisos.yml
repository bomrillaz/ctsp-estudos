name: Push dos avisos CTSP

# b103. Roda a cada 5 min e manda o push de verdade dos avisos disparados pelo painel
# admin (central de notificações). Silencioso quando não há pushPendente:true.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

# Menor privilegio: estes jobs so leem o repo. O acesso ao Firebase vem do
# service account no env, nao do GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: .github/scripts
        run: npm ci --no-audit --no-fund

      - name: Enviar avisos pendentes
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node enviar-avisos.js
